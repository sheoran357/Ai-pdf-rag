name: CI

on:
  push:
    branches:
      - main
      - cleanup/ai-pdf-rag
  pull_request:
    branches:
      - main
      - cleanup/ai-pdf-rag
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Build production frontend
        run: npm run build

  node-backend:
    name: Node backend dependency and syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node-backend/package-lock.json
      - name: Install dependencies
        working-directory: node-backend
        run: npm ci
      - name: Check JavaScript syntax
        shell: bash
        run: find node-backend/src -type f -name '*.js' -print0 | xargs -0 -n 1 node --check

  python-backend:
    name: Python backend dependency and import checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/app/req.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/app/req.txt
      - name: Compile Python modules
        run: python -m compileall -q backend/app
      - name: Import FastAPI application
        env:
          PYTHONPATH: backend/app
        run: python -c "import api; print(api.app.title)"
      - name: Smoke-test PDF listing endpoint
        env:
          PYTHONPATH: backend/app
        run: python -c "from fastapi.testclient import TestClient; import api; response = TestClient(api.app).get('/list-pdfs'); assert response.status_code == 200, response.text; print(response.json())"
